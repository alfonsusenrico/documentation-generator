name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: make install
      - name: Quality gates
        run: make ci

  integration:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: make install
      - name: Integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
          REDIS_URL: redis://localhost:6379
        run: make test-integration

  migrations:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]')) && hashFiles('migrations/**', 'alembic/**', 'prisma/**', 'db/migrate/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: make install
      - name: Migration gate
        run: make migrate-check

  docker-build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Docker build verification
        run: docker build -t {{IMAGE_NAME}}:sha-${{ github.sha }} .

  security:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: make install
      - name: Dependency audit
        run: make scan
      - name: Build image for scan
        run: docker build -t {{IMAGE_NAME}}:sha-${{ github.sha }} .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "{{IMAGE_NAME}}:sha-${{ github.sha }}"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "table"

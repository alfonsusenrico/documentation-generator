name: Deploy Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd {{DEPLOY_PATH_STAGING}}
            mkdir -p "$(dirname {{DEPLOY_LOG_PATH}})" "$(dirname {{METRICS_LOG_PATH}})"
            WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if ! grep -q '^IMAGE_NAME=' .env; then
              echo 'IMAGE_NAME={{IMAGE_NAME}}' >> .env
            fi
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=sha-${{ github.sha }}/' .env
            else
              echo 'IMAGE_TAG=sha-${{ github.sha }}' >> .env
            fi
            docker compose pull
            docker compose up -d
            if ! curl -fsS http://localhost:{{APP_PORT}}{{HEALTH_ENDPOINT}}; then
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) staging sha-${{ github.sha }} failure ${WORKFLOW_URL}" >> {{DEPLOY_LOG_PATH}}
              printf '{"timestamp":"%s","env":"staging","sha":"sha-%s","result":"failure","run_id":"%s","workflow_url":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.sha }}" "${{ github.run_id }}" "${WORKFLOW_URL}" >> {{METRICS_LOG_PATH}}
              exit 1
            fi
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) staging sha-${{ github.sha }} success ${WORKFLOW_URL}" >> {{DEPLOY_LOG_PATH}}
            printf '{"timestamp":"%s","env":"staging","sha":"sha-%s","result":"success","run_id":"%s","workflow_url":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.sha }}" "${{ github.run_id }}" "${WORKFLOW_URL}" >> {{METRICS_LOG_PATH}}
